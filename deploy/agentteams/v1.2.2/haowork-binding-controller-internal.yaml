apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: haowork-runtime-bindings
  namespace: haowork-internal
  labels:
    app.kubernetes.io/name: haowork-agentteams-binding-controller
    app.kubernetes.io/component: runtime-binding
    haowork.io/zone: internal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 64Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: haowork-agentteams-binding-controller
  namespace: haowork-internal
  labels:
    app.kubernetes.io/name: haowork-agentteams-binding-controller
    app.kubernetes.io/component: runtime-binding
    haowork.io/zone: internal
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: haowork-agentteams-binding-controller
  namespace: haowork-internal
  labels:
    app.kubernetes.io/name: haowork-agentteams-binding-controller
    app.kubernetes.io/component: runtime-binding
    haowork.io/zone: internal
rules:
  - apiGroups: ["agentteams.io"]
    resources: ["workers", "teams"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    # Static demo Mission only. A trusted deployer must generate a separate
    # namespaced Role with exact resourceNames for every additional Mission.
    resourceNames: ["agentteams-creds-haowork-msn-p005-v122-internal-delivery-leader"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: haowork-agentteams-binding-controller
  namespace: haowork-internal
  labels:
    app.kubernetes.io/name: haowork-agentteams-binding-controller
    app.kubernetes.io/component: runtime-binding
    haowork.io/zone: internal
subjects:
  - kind: ServiceAccount
    name: haowork-agentteams-binding-controller
    namespace: haowork-internal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: haowork-agentteams-binding-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haowork-agentteams-binding-controller
  namespace: haowork-internal
  labels:
    app.kubernetes.io/name: haowork-agentteams-binding-controller
    app.kubernetes.io/component: runtime-binding
    haowork.io/zone: internal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: haowork-agentteams-binding-controller
      haowork.io/zone: internal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haowork-agentteams-binding-controller
        app.kubernetes.io/component: runtime-binding
        haowork.io/zone: internal
    spec:
      serviceAccountName: haowork-agentteams-binding-controller
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: binding-controller
          image: haowork-agentteams-binding-controller:local
          imagePullPolicy: Never
          command: ["/haowork-agentteams-binding-controller"]
          env:
            - name: HAOWORK_BINDING_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HAOWORK_BINDING_CONTROLLER_NAME
              value: haowork-internal-agentteams-controller
            - name: HAOWORK_BINDING_GOVERNANCE_ROOT
              value: /var/lib/haowork/governance
            - name: HAOWORK_BINDING_OUTPUT_ROOT
              value: /var/lib/haowork/bindings
            - name: HAOWORK_BINDING_ALLOWED_SECRET_NAMES
              value: agentteams-creds-haowork-msn-p005-v122-internal-delivery-leader
            - name: HAOWORK_BINDING_TTL
              value: 2m
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: governance-state
              mountPath: /var/lib/haowork/governance
              readOnly: true
            - name: runtime-bindings
              mountPath: /var/lib/haowork/bindings
              readOnly: false
      volumes:
        - name: governance-state
          persistentVolumeClaim:
            claimName: haowork-governance-state
        - name: runtime-bindings
          persistentVolumeClaim:
            claimName: haowork-runtime-bindings
