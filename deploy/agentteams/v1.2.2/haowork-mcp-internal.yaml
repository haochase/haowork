apiVersion: v1
kind: Service
metadata:
  name: haowork-mcp
  namespace: haowork-internal
  labels:
    app.kubernetes.io/name: haowork-mcp
    app.kubernetes.io/component: governance-mcp
    haowork.io/zone: internal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: haowork-mcp
    haowork.io/zone: internal
  ports:
    - name: http
      port: 8080
      targetPort: http
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haowork-mcp
  namespace: haowork-internal
  labels:
    app.kubernetes.io/name: haowork-mcp
    app.kubernetes.io/component: governance-mcp
    haowork.io/zone: internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: haowork-mcp
      haowork.io/zone: internal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haowork-mcp
        app.kubernetes.io/component: governance-mcp
        haowork.io/zone: internal
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: haowork-mcp
          image: haowork-mcp:local
          imagePullPolicy: Never
          command: ["/haowork-mcp"]
          env:
            - name: HAOWORK_MCP_LISTEN_ADDR
              value: "0.0.0.0:8080"
            - name: HAOWORK_MCP_PROJECT
              value: /var/lib/haowork/project
            - name: HAOWORK_MCP_SKILLS_DIR
              value: /opt/haowork/skills
            - name: HAOWORK_MCP_BINDINGS_FILE
              value: /var/run/secrets/haowork-mcp/bindings.json
            - name: HAOWORK_MCP_USE_CORE_BRIDGE_STATE
              value: "true"
            - name: HAOWORK_MCP_ROUTE_PATH
              value: /mcp-servers/haowork-mcp/mcp
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: governance-state
              mountPath: /var/lib/haowork/project
              readOnly: false
            - name: runtime-consumer-bindings
              mountPath: /var/run/secrets/haowork-mcp
              readOnly: true
      volumes:
        - name: governance-state
          persistentVolumeClaim:
            claimName: haowork-governance-state
        - name: runtime-consumer-bindings
          secret:
            secretName: haowork-mcp-runtime-bindings
            defaultMode: 256
            items:
              - key: bindings.json
                path: bindings.json
