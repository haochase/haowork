apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: haowork-governance-state
  namespace: haowork-internal
  labels:
    app.kubernetes.io/name: haowork-core-bridge
    app.kubernetes.io/component: governance-bridge
    haowork.io/zone: internal
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: haowork-core-bridge
  namespace: haowork-internal
  labels:
    app.kubernetes.io/name: haowork-core-bridge
    app.kubernetes.io/component: governance-bridge
    haowork.io/zone: internal
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: haowork-core-bridge
  namespace: haowork-internal
  labels:
    app.kubernetes.io/name: haowork-core-bridge
    app.kubernetes.io/component: governance-bridge
rules:
  - apiGroups: ["agentteams.io"]
    resources: ["managers", "workers", "teams", "humans"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: haowork-core-bridge
  namespace: haowork-internal
  labels:
    app.kubernetes.io/name: haowork-core-bridge
    app.kubernetes.io/component: governance-bridge
subjects:
  - kind: ServiceAccount
    name: haowork-core-bridge
    namespace: haowork-internal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: haowork-core-bridge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: haowork-core-bridge-discovery
  labels:
    app.kubernetes.io/name: haowork-core-bridge
    app.kubernetes.io/component: governance-bridge
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: haowork-core-bridge-discovery-internal
  labels:
    app.kubernetes.io/name: haowork-core-bridge
    app.kubernetes.io/component: governance-bridge
subjects:
  - kind: ServiceAccount
    name: haowork-core-bridge
    namespace: haowork-internal
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: haowork-core-bridge-discovery
---
apiVersion: v1
kind: Service
metadata:
  name: haowork-core-bridge
  namespace: haowork-internal
  labels:
    app.kubernetes.io/name: haowork-core-bridge
    app.kubernetes.io/component: governance-bridge
    haowork.io/zone: internal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: haowork-core-bridge
    haowork.io/zone: internal
  ports:
    - name: http
      port: 8081
      targetPort: http
      appProtocol: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haowork-core-bridge
  namespace: haowork-internal
  labels:
    app.kubernetes.io/name: haowork-core-bridge
    app.kubernetes.io/component: governance-bridge
    haowork.io/zone: internal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: haowork-core-bridge
      haowork.io/zone: internal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haowork-core-bridge
        app.kubernetes.io/component: governance-bridge
        haowork.io/zone: internal
    spec:
      serviceAccountName: haowork-core-bridge
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: haowork-core-bridge
          image: haowork-core-bridge:local
          imagePullPolicy: Never
          command: ["/haowork-core-bridge"]
          env:
            - name: HAOWORK_CORE_BRIDGE_LISTEN_ADDR
              value: "0.0.0.0:8081"
            - name: HAOWORK_CORE_BRIDGE_STATE_ROOT
              value: /var/lib/haowork/project
            - name: HAOWORK_CORE_PROJECT_ID
              value: PRJ-P005-V122
            - name: HAOWORK_CORE_BRIDGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haowork-core-bridge-runtime
                  key: token
            - name: HAOWORK_CORE_ENVIRONMENT_ID
              value: internal
            - name: HAOWORK_CORE_NAMESPACE
              value: haowork-internal
            - name: HAOWORK_CORE_CONTROLLER_NAME
              value: haowork-internal-agentteams-controller
            - name: HAOWORK_CORE_MATRIX_URL
              value: http://haowork-internal-agentteams-tuwunel.haowork-internal.svc.cluster.local:6167
            - name: HAOWORK_CORE_MATRIX_APPSERVICE_AS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: haowork-core-bridge-runtime
                  key: matrix-appservice-as-token
            - name: HAOWORK_CORE_S3_ENDPOINT
              value: haowork-internal-agentteams-minio.haowork-internal.svc.cluster.local:9000
            - name: HAOWORK_CORE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: haowork-internal-agentteams-minio
                  key: MINIO_ROOT_USER
            - name: HAOWORK_CORE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: haowork-internal-agentteams-minio
                  key: MINIO_ROOT_PASSWORD
            - name: HAOWORK_CORE_S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: haowork-core-bridge-runtime
                  key: bucket
            - name: HAOWORK_CORE_HIGRESS_CONSOLE_URL
              value: http://higress-console.haowork-internal.svc.cluster.local:8080
            - name: HAOWORK_CORE_HIGRESS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: higress-console
                  key: adminUsername
            - name: HAOWORK_CORE_HIGRESS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: higress-console
                  key: adminPassword
            - name: HAOWORK_CORE_MCP_SERVER_NAME
              value: haowork-mcp
            - name: HAOWORK_CORE_MCP_CONSUMER_NAME
              value: manager
            - name: HAOWORK_CORE_MCP_ROUTE_NAME
              value: mcp-server-haowork-mcp.internal
            - name: HAOWORK_CORE_MODEL
              valueFrom:
                secretKeyRef:
                  name: haowork-core-bridge-runtime
                  key: model
            - name: HAOWORK_CORE_MANAGER_RUNTIME
              value: openclaw
            - name: HAOWORK_CORE_MANAGER_IMAGE
              valueFrom:
                secretKeyRef:
                  name: haowork-core-bridge-runtime
                  key: manager-image
            - name: HAOWORK_CORE_WORKER_RUNTIME
              value: openclaw
            - name: HAOWORK_CORE_MCP_URL
              value: http://aigw-local.agentteams.io:8080/mcp-servers/haowork-mcp
            - name: HAOWORK_CORE_MCP_TRANSPORT
              value: http
            - name: HAOWORK_CORE_HUMAN_NAME
              value: owner
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: governance-state
              mountPath: /var/lib/haowork/project
              readOnly: false
      volumes:
        - name: governance-state
          persistentVolumeClaim:
            claimName: haowork-governance-state
