apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: haowork-higress-binding-state
  namespace: haowork-internal
  labels:
    app.kubernetes.io/name: haowork-higress-binding-publisher
    app.kubernetes.io/component: route-binding-state
    haowork.io/zone: internal
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 16Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: haowork-higress-binding-publisher
  namespace: haowork-internal
  labels:
    app.kubernetes.io/name: haowork-higress-binding-publisher
    app.kubernetes.io/component: route-binding
    haowork.io/zone: internal
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haowork-higress-binding-publisher
  namespace: haowork-internal
  labels:
    app.kubernetes.io/name: haowork-higress-binding-publisher
    app.kubernetes.io/component: route-binding
    haowork.io/zone: internal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: haowork-higress-binding-publisher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: haowork-higress-binding-publisher
        app.kubernetes.io/component: route-binding
        haowork.io/zone: internal
    spec:
      serviceAccountName: haowork-higress-binding-publisher
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-publisher-state
          image: haowork-higress-binding-publisher:local
          imagePullPolicy: Never
          command: ["/haowork-higress-binding-publisher"]
          args: ["prepare-state-dir", "/var/lib/haowork/publisher-state/managed-consumers.json"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: publisher-state
              mountPath: /var/lib/haowork/publisher-state
              readOnly: false
      containers:
        - name: route-binding-publisher
          image: haowork-higress-binding-publisher:local
          imagePullPolicy: Never
          command: ["/haowork-higress-binding-publisher"]
          env:
            - name: HAOWORK_HIGRESS_CONSOLE_URL
              value: http://higress-console.haowork-internal.svc.cluster.local:8080
            - name: HAOWORK_HIGRESS_ALLOWED_CONSOLE_HOSTS
              value: higress-console.haowork-internal.svc.cluster.local:8080
            - name: HAOWORK_HIGRESS_ALLOW_LOOPBACK
              value: "false"
            - name: HAOWORK_HIGRESS_CONSOLE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: higress-console
                  key: adminUsername
            - name: HAOWORK_HIGRESS_CONSOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: higress-console
                  key: adminPassword
            - name: HAOWORK_HIGRESS_MCP_SERVER_NAME
              value: haowork-mcp
            - name: HAOWORK_HIGRESS_BINDINGS_PATH
              value: /var/lib/haowork/bindings/mcp-bindings.json
            - name: HAOWORK_HIGRESS_STATE_PATH
              value: /var/lib/haowork/publisher-state/managed-consumers.json
            - name: HAOWORK_HIGRESS_POLL_INTERVAL
              value: 10s
            - name: HAOWORK_HIGRESS_RETRY_INTERVAL
              value: 500ms
            - name: HAOWORK_HIGRESS_MAX_ATTEMPTS
              value: "3"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: runtime-bindings
              mountPath: /var/lib/haowork/bindings
              readOnly: true
            - name: publisher-state
              mountPath: /var/lib/haowork/publisher-state
              readOnly: false
      volumes:
        - name: runtime-bindings
          persistentVolumeClaim:
            claimName: haowork-runtime-bindings
        - name: publisher-state
          persistentVolumeClaim:
            claimName: haowork-higress-binding-state
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: haowork-higress-binding-publisher
  namespace: haowork-internal
  labels:
    app.kubernetes.io/name: haowork-higress-binding-publisher
    haowork.io/zone: internal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: haowork-higress-binding-publisher
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: higress-console
              app.kubernetes.io/instance: haowork-internal-agentteams
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
